<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeServe | Build with Agentic Pipelines</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
  <nav class="p-6 flex justify-between items-center border-b border-slate-700">
    <div class="text-2xl font-bold">VibeServe</div>
    <div class="space-x-4">
      <a href="#" class="hover:text-sky-400">Features</a>
      <a href="#" class="hover:text-sky-400">Pricing</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-12 text-center">
    <h1 class="text-5xl font-extrabold mb-6">Build faster with Agentic Pipelines.</h1>
    <p class="text-xl text-slate-400 mb-10">VibeServe brings autonomous engineering workflows directly into your IDE.</p>
    <button class="bg-sky-600 hover:bg-sky-500 px-8 py-3 rounded-lg font-bold text-lg">Get Started</button>

    <div class="grid grid-cols-3 gap-8 mt-20">
      <div class="p-6 bg-slate-800 rounded-xl">
        <h3 class="font-bold mb-2">Agentic Pipelines</h3>
        <p class="text-sm text-slate-400">Automate multi-step engineering tasks.</p>
      </div>
      <div class="p-6 bg-slate-800 rounded-xl">
        <h3 class="font-bold mb-2">Live Preview</h3>
        <p class="text-sm text-slate-400">See your code as you write it.</p>
      </div>
      <div class="p-6 bg-slate-800 rounded-xl">
        <h3 class="font-bold mb-2">WCAG Auditor</h3>
        <p class="text-sm text-slate-400">Ensures accessibility by default.</p>
      </div>
    </div>
  </main>
