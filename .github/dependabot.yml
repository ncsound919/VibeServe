version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/ide"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: auto
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
      hono:
        patterns:
          - "hono"
          - "@hono/*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      testing:
        patterns:
          - "playwright"
          - "@playwright/*"
          - "vitest"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
