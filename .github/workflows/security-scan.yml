name: Security Scan

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit --strict

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py --format json -o sbom-vibeserve.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-vibeserve
          path: sbom-vibeserve.cdx.json

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Build image
        run: docker build -t vibeserve:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: vibeserve:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-licenses
      - name: Check allowed licenses
        run: |
          pip-licenses --allow-only "MIT License;Apache Software License;BSD License;ISC License;Python Software Foundation License;Mozilla Public License 2.0" --summary
