name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          VIBESERVE_API_SECRET: ci-test-secret-32-chars-minimum
          DEFAULT_LLM_PROVIDER: local
          OPENAI_API_KEY: ""
          DEEPSEEK_API_KEY: ""
