name: CI

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Dependency security audit
        run: |
          pip install pip-audit
          pip-audit

      - name: Lint with ruff
        run: ruff check vibeserve/ tests/

      - name: Type check with mypy
        run: mypy vibeserve/ --ignore-missing-imports

      - name: Pipeline security tests
        run: python -m pytest tests/test_pipeline_security.py -v

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=vibeserve --cov-report=term-missing --cov-fail-under=80
        env:
          VIBESERVE_API_SECRET: ${{ secrets.VIBESERVE_API_SECRET }}
          DEEPSEEK_API_KEY: ""
          OPENROUTER_API_KEY: ""
          DEFAULT_LLM_PROVIDER: "local"

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Node dependencies
        working-directory: ide
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ide
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ide
        run: npx playwright test --project=chromium
        env:
          VIBESERVE_WORKSPACE: .
