name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check vibeserve.py test_aether_nexus.py test_integration_v5.py

      - name: Type check with mypy
        run: mypy vibeserve.py --ignore-missing-imports

      - name: Run tests
        run: pytest test_aether_nexus.py test_integration_v5.py -v --tb=short
        env:
          OPENAI_API_KEY: "sk-test-mock"
          DEEPSEEK_API_KEY: ""
          OPENROUTER_API_KEY: ""
          DEFAULT_LLM_PROVIDER: "local"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
