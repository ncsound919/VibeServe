name: Publish to PyPI

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest tests/ -q --cov=vibeserve --cov-fail-under=80
        env:
          VIBESERVE_API_SECRET: "test-dummy-secret"
          DEEPSEEK_API_KEY: ""
          OPENROUTER_API_KEY: ""
          DEFAULT_LLM_PROVIDER: "local"

  lint:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check vibeserve/

      - name: Type check with mypy
        run: mypy vibeserve/

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install bandit

      - name: Security scan with bandit
        run: bandit -r vibeserve/ -ll

  changelog:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify CHANGELOG entry for current version
        run: |
          python -c "
          import tomllib
          v = tomllib.load(open('pyproject.toml','rb'))['project']['version']
          c = open('CHANGELOG.md').read()
          assert f'[{v}]' in c, f'CHANGELOG.md missing entry for version [{v}]'
          print(f'CHANGELOG.md has entry for [{v}]')
          "

  build:
    needs: [lint, security, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify package with twine
        run: python -m twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  attest:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/

  publish:
    needs: [build, attest]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vibeserve
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
