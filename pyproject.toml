[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeserve"
version = "1.1.0"
description = "Agentic coding orchestrator for the Model Context Protocol. Vibe coding pipeline: architect, code, review, verify, iterate, test, deploy."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.9.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
]
long_description = {file = "README.md"}
long_description_content_type = "text/markdown"
license = {text = "MIT"}
readme = "README.md"
keywords = ["mcp", "agentic-coding", "vibe-coding", "ui-design", "accessibility", "wcag", "llm", "multi-agent", "fastmcp", "code-generation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/ncsound919/VibeServe"
Documentation = "https://ncsound919.github.io/VibeServe"
Repository = "https://github.com/ncsound919/VibeServe"
Issues = "https://github.com/ncsound919/VibeServe/issues"
"Donate" = "https://cash.app/$helptools"

[project.scripts]
vibeserve = "vibeserve.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.10.0"]

[tool.setuptools.packages.find]
include = ["vibeserve", "vibeserve.*"]

[tool.setuptools]
# py-modules = ["benchmark"]  # Moved to dev dependencies

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
