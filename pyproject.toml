[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeserve"
version = "2.0.0"
description = "Agentic coding orchestrator for the Model Context Protocol. Vibe coding pipeline: architect, code, review, verify, iterate, test, deploy."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.9.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
]
license = {text = "MIT"}
readme = "README.md"
keywords = ["mcp", "agentic-coding", "vibe-coding", "ui-design", "accessibility", "wcag", "llm", "multi-agent", "fastmcp", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/ncsound919/VibeServe"
Documentation = "https://ncsound919.github.io/VibeServe"
Repository = "https://github.com/ncsound919/VibeServe"
Issues = "https://github.com/ncsound919/VibeServe/issues"
"Donate" = "https://cash.app/$helptools"

[project.scripts]
vibeserve = "vibeserve.__main__:main"
make-docs = "scripts.generate_docs:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

big-homie = []
mem0 = ["mem0ai>=1.0.11"]
nanobot = ["nanobot-ai>=0.1.0"]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
]

[tool.setuptools.packages.find]
include = ["vibeserve", "vibeserve.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--cov=vibeserve", "--cov-report=term-missing", "--cov-fail-under=80", "--cov-config=pyproject.toml"]

[tool.coverage.run]
source = ["vibeserve"]
omit = [
    "vibeserve/__main__.py",
    "vibeserve/http_bridge.py",
    "vibeserve/entrypoint.py",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
