name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  # FIX: publish job now depends on test + security passing.
  # Previously had zero `needs:` — a broken commit could publish to PyPI.
  pypi:
    runs-on: ubuntu-latest
    needs: [preflight]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/vibeserve
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # FIX: validate the package actually installs and runs after publishing.
      # Previously there was no post-publish smoke test — a broken sdist would
      # silently reach users.
      - name: Post-publish smoke test
        run: |
          sleep 30  # Allow PyPI index to propagate
          TAG=${GITHUB_REF#refs/tags/v}
          pip install "vibeserve==${TAG}"
          vibeserve --version || python -m vibeserve --version
          echo "Post-publish smoke test passed for vibeserve==${TAG}"

  # Preflight: run tests, security scan, and changelog check before publishing.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v --tb=short --cov=vibeserve --cov-fail-under=80
        env:
          OPENAI_API_KEY: "test-not-a-real-key"
          DEFAULT_LLM_PROVIDER: "local"
          VIBESERVE_API_SECRET: "preflight-test-secret-not-production-32chars"

      - name: Security scan (full history)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: --only-verified

      # FIX: enforce that CHANGELOG.md was updated before tagging a release.
      # Checks that the tag version appears in CHANGELOG.md.
      - name: Verify CHANGELOG entry for this release
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          if ! grep -q "\[${TAG}\]" CHANGELOG.md; then
            echo "ERROR: No CHANGELOG.md entry found for version ${TAG}"
            echo "Add a [${TAG}] section to CHANGELOG.md before releasing."
            exit 1
          fi
          echo "CHANGELOG entry verified for ${TAG}"
